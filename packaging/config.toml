# hotbar config
#
# Linux and macOS: ~/.config/hotbar/config.toml
# Windows:         %APPDATA%\hotbar\config\config.toml
#
# The daemon reloads this file by itself when you save it.

[history]
max_items = 500          # entries kept (slots never count and are never dropped)
max_age_days = 0         # 0 keeps entries forever
min_length = 1           # ignore text shorter than this
max_length = 0           # ignore text longer than this, 0 for no limit
max_image_mb = 20        # ignore images bigger than this
ignore_sensitive = true  # skip copies that password managers mark as secret
ignore_blank = true      # skip copies that are only whitespace

[keys]
# How the slot chords work:
#   "ctrl-held"  hold Ctrl, tap V (or C), tap a digit. A plain Ctrl+V pastes
#                as soon as you let go of Ctrl or press any other key.
#   "release"    Ctrl+V, let go of everything, then press a digit within
#                timeout_ms. Normal pastes wait for the timeout.
#   "off"        no key handling. Bind `hotbar paste N` and `hotbar save N`
#                in your window manager instead.
chord = "ctrl-held"
timeout_ms = 300

# "auto" uses Cmd on macOS and Ctrl everywhere else.
primary = "auto"

# Opens the history picker. Default is "super+v" ("cmd+shift+v" on macOS).
# Set it to "" if your window manager runs `hotbar pick` itself.
# picker = "super+v"

# Physical keys used for copy and paste. Dvorak users on Linux want
# copy_key = "i" and paste_key = ".".
copy_key = "c"
paste_key = "v"

# Accept keypad digits too.
numpad = true

[paste]
# After pasting a slot, put back what was on the clipboard before.
restore_clipboard = true
restore_delay_ms = 300
# Small notification when a slot is saved.
notify = true

[picker]
# "builtin" or any dmenu style command, for example:
#   command = "fuzzel --dmenu"
#   command = "rofi -dmenu -p hotbar"
#   command = "wofi --dmenu"
command = "builtin"
width = 640.0
height = 460.0
close_on_unfocus = true

[theme]
# Use colors from pywal (~/.cache/wal/colors.json) when available.
pywal = false
background = "#1e1e2ef5"
surface = "#313244"
foreground = "#cdd6f4"
muted = "#7f849c"
accent = "#89b4fa"
radius = 12.0
font_size = 15.0
