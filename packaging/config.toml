# hotbar config. Every line is optional: delete anything you don't change.
# The daemon reloads this file when you save it.

[keys]
# "ctrl-held"  hold Ctrl, tap V, tap a digit (default)
# "release"    Ctrl+V, let go, then the digit within 300 ms
# "off"        no key handling; bind `hotbar paste N` in your window manager
chord = "ctrl-held"

# Picker hotkey. Default: super+v on Linux, ctrl+alt+v on Windows,
# cmd+shift+v on macOS. Use "" to turn it off.
# picker = "ctrl+alt+v"

[history]
max_items = 500
max_age_days = 0     # 0 keeps entries forever

[picker]
# "builtin", or a menu such as "fuzzel --dmenu" or "rofi -dmenu"
command = "builtin"

[theme]
pywal = false        # use colors from ~/.cache/wal/colors.json
accent = "#89b4fa"
